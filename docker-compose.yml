version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cinema_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cinema_network

  web:
    build: .
    container_name: cinema_web
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    stdin_open: true
    tty: true
    networks:
      - cinema_network

  fastapi_service:
    build:
      context: ./fastapi_service
      dockerfile: Dockerfile
    container_name: fastapi_service
    ports:
      - "${FASTAPI_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    env_file:
      - .env
    environment:
      - APP_NAME=${FASTAPI_APP_NAME}
      - DEBUG=${FASTAPI_DEBUG}
      - LOG_LEVEL=${FASTAPI_LOG_LEVEL}
      - CORS_ORIGINS=${FASTAPI_CORS_ORIGINS}
      - SECRET_KEY=${FASTAPI_SECRET_KEY}
      - DATABASE_URL=${FASTAPI_DATABASE_URL}
      - DJANGO_API_URL=${FASTAPI_DJANGO_API_URL}
      - DJANGO_API_TIMEOUT=${FASTAPI_DJANGO_API_TIMEOUT}
    volumes:
      - ./fastapi_service:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - cinema_network

  ugc_db:
    image: postgres:15-alpine
    container_name: cinema_ugc_db
    volumes:
      - ugc_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ugc_db
      POSTGRES_USER: ugc_user
      POSTGRES_PASSWORD: ugc_pass
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ugc_user -d ugc_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cinema_network

  ugc_service:
    build:
      context: ./ugc_service
      dockerfile: Dockerfile
    container_name: ugc_service
    ports:
      - "5001:5001"
    depends_on:
      ugc_db:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://ugc_user:ugc_pass@ugc_db:5432/ugc_db
      - DJANGO_API_URL=http://web:8000/api
    volumes:
      - ./ugc_service:/app
    command: python run.py
    networks:
      - cinema_network

volumes:
  postgres_data:
  static_volume:
  media_volume:
  ugc_postgres_data:

networks:
  cinema_network:
    driver: bridge